<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliExpress Orders</title>
    <style>
{{styles}}
    </style>
</head>
<body>
    <div class="container">
        <h1>My Orders</h1>
        
        <div class="summary">
            <span class="summary-text">{{order_count}} orders</span>
            <span class="summary-total">Total: € {{total_price}}</span>
        </div>
        
        <div class="sort-controls">
            <span class="sort-label">Sort by:</span>
            <button class="sort-btn" data-sort="default" onclick="toggleSort('default')">Default</button>
            <button class="sort-btn" data-sort="price" onclick="toggleSort('price')">Price</button>
            <button class="sort-btn" data-sort="date" onclick="toggleSort('date')">Date</button>
            <button class="sort-btn" data-sort="checked" onclick="toggleSort('checked')">Received</button>
            <button class="export-btn" onclick="window.print()" title="Export all orders to an A4 PDF">Export PDF</button>
            <button class="hide-btn" id="hideCheckedBtn" onclick="toggleHideChecked()">Hide Received</button>
        </div>
        
        <div id="orders-container">
{{order_cards}}
        </div>
        
        <div class="footer">
            <span class="footer-text">{{order_count}} orders</span>
            <span class="footer-total">Total: € {{total_price}}</span>
        </div>
    </div>

    <button id="scrollTopBtn" class="scroll-top-btn" title="Back to top" aria-label="Back to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <script>
{{script}}
    </script>
</body>
</html>
